<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoreDay | Coming to Android</title>
    <link rel="icon" type="image/png" href="shoreday_icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #26C6B0;
            --text-light: #F8FAFC;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Matching Tropical Background */
        body { 
            background-image: linear-gradient(rgba(10, 17, 40, 0.75), rgba(10, 17, 40, 0.95)), url('https://images.unsplash.com/photo-1548574505-5e239809ee19?q=80&w=2564&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light); 
            line-height: 1.6; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
        /* Nav */
        nav { display: flex; justify-content: space-between; padding: 2rem 5%; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: white; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo span { color: var(--primary-teal); }
        
        /* Waitlist Layout */
        .waitlist-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 4rem 5%; 
            max-width: 800px; 
            margin: auto auto; 
            flex: 1; 
        }
        
        .badge { 
            display: inline-block;
            background: rgba(38, 198, 176, 0.15); 
            color: var(--primary-teal); 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 1.5rem; 
            border: 1px solid rgba(38, 198, 176, 0.3); 
            backdrop-filter: blur(4px); 
        }
        h1 { font-size: 3.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 1.5rem; letter-spacing: -1px; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
        p.subtitle { font-size: 1.2rem; color: #E2E8F0; margin-bottom: 2.5rem; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        
        /* Form Styling */
        .email-form {
            display: flex;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .email-form input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 25px;
            color: white;
            font-size: 1.05rem;
            outline: none;
        }
        .email-form input::placeholder { color: #94A3B8; }
        .email-form button {
            background: var(--primary-teal);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .email-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(38, 198, 176, 0.4);
        }

        /* Footer */
        footer { border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 2rem 5%; text-align: center; color: #94A3B8; font-size: 0.9rem; margin-top: auto; background: rgba(10, 17, 40, 0.8); backdrop-filter: blur(10px); }
        footer a { color: #E2E8F0; text-decoration: none; margin: 0 10px; transition: color 0.2s; }
        footer a:hover { color: var(--primary-teal); }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .email-form { flex-direction: column; border-radius: 20px; padding: 15px; gap: 10px; background: rgba(255,255,255,0.08); }
            .email-form input { padding: 10px; text-align: center; }
            .email-form button { width: 100%; padding: 15px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="logo_transparent.png" alt="ShoreDay Icon" style="height: 36px; width: auto;">
            <div>Shore<span>Day</span></div>
        </a>
    </nav>

    <main class="waitlist-container">
        <div class="badge">Android Waitlist</div>
        <h1>Coming soon to Google Play</h1>
        <p class="subtitle">Our team is hard at work developing the Android version of ShoreDay. Drop your email below to get notified the exact moment we launch!</p>
        
        <form class="email-form" action="#" method="POST" onsubmit="alert('Thanks for subscribing! We will notify you as soon as the Android app is ready.'); return false;">
            <input type="email" placeholder="Enter your email address..." required>
            <button type="submit">Notify Me</button>
        </form>
    </main>

    <footer>
        <div style="margin-bottom: 1rem;">
            <a href="index.html">Back to Home</a> | 
            <a href="privacy.html">Privacy Policy</a> | 
            <a href="terms.html">Terms of Service</a>
        </div>
        <p>&copy; 2026 VMAManagement LLC - ShoreDay. All rights reserved.</p>
    </footer>
</body>
</html>
